
#Dev server
server.port=8019
#Live server
#server.port=7003








server.error.whitelabel.enabled=false

#swagger info 
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
web.site.link=https://basesetup.com/
web.contact.name=basesetup

#cors.allowed-origins
cors.allowed-origins=http://localhost:3000,http://localhost:4000

#Logger properties
logging.level.org.springframework=info
logging.level.com.base.basesetup=DEBUG
#logging.file.name=base_setup_log
#logging.file.path=C:/base/base_setup_log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} : %msg%n
logging.config= classpath:logback-spring.xml

#MYSQL DB Config
spring.datasource.url = jdbc:mysql://localhost:3306/loan_collection?allowPublicKeyRetrieval=true&useSSL=false

spring.datasource.username = root
spring.datasource.password = root
spring.jpa.show-sql = true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.flyway.baseline-on-migrate=true

